[project]
name = "musfi-shop-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.1",
    "python-jose[cryptography]==3.3.0",
    "bcrypt>=4.1.0",
    "python-multipart==0.0.9",
    "aiofiles==23.2.1",
    "httpx==0.27.0",
    "slowapi==0.1.9",
    "python-dotenv==1.0.1",
    "greenlet==3.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "anyio==4.4.0",
]

[tool.uv]
package = false
dev-dependencies = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "anyio==4.4.0",
]
