version: "3.9"

networks:
  coolify:
    external: true
  internal:
    driver: bridge

services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      FRONTEND_URL: ${FRONTEND_URL}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD}
      EXTRA_CORS_ORIGINS: ${EXTRA_CORS_ORIGINS:-}
      APP_ENV: production
    networks:
      - internal
      - coolify
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend
    networks:
      - internal
      - coolify
    expose:
      - "80"
    restart: unless-stopped
